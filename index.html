<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#d9edff"><title>Love may ♡</title>
<style>
:root{--blue:#7eb4f5;--deep:#538bd5;--pale:#f5fbff;--line:#c4e1ff}*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;min-height:100vh;color:#5f94d5;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:radial-gradient(ellipse at 50% 15%,#fff 0,#eaf6ff 42%,#d9ecff 100%);overflow-x:hidden}body:before{content:"";position:fixed;inset:0;z-index:-3;pointer-events:none;background:linear-gradient(180deg,rgba(226,243,255,.68),rgba(239,249,255,.80)),url("assets/love-may-logo.png") center center/cover no-repeat;opacity:.9;filter:saturate(.82)}body:after{content:"";position:fixed;inset:0;z-index:-2;pointer-events:none;background:radial-gradient(ellipse at center,rgba(255,255,255,.28),rgba(193,224,255,.26));} .clouds{position:fixed;inset:0;pointer-events:none;opacity:.52;background-image:radial-gradient(ellipse at 8% 100%,white 0 12%,transparent 12.5%),radial-gradient(ellipse at 20% 105%,white 0 13%,transparent 13.5%),radial-gradient(ellipse at 83% 105%,white 0 15%,transparent 15.5%),radial-gradient(ellipse at 97% 100%,white 0 11%,transparent 11.5%);z-index:-1}.sparkles{position:fixed;inset:0;pointer-events:none;color:#fff;font-size:24px;z-index:-1}.sparkles span{position:absolute;animation:float 4s ease-in-out infinite}.sparkles span:nth-child(1){top:12%;left:8%}.sparkles span:nth-child(2){top:23%;right:9%;animation-delay:1s}.sparkles span:nth-child(3){top:55%;left:4%;animation-delay:2s}.sparkles span:nth-child(4){top:70%;right:6%;animation-delay:.7s}@keyframes float{50%{transform:translateY(-12px) rotate(12deg)}}.wrap{width:min(900px,100%);margin:auto;padding:20px 16px 34px;text-align:center}.logo{width:min(430px,94%);height:auto;display:block;margin:0 auto -5px;filter:drop-shadow(0 8px 18px #8bbef32b);border-radius:22px;mix-blend-mode:multiply}.message{font-size:clamp(16px,3.5vw,23px);font-weight:750;line-height:1.8;margin:8px auto 22px;max-width:600px;color:#6098dc;text-shadow:0 1px white}.heartline{letter-spacing:10px;color:#91c5ff}.gallery{position:relative;margin:0 auto;padding:12px;background:#ffffff8a;border:1px solid #b9dcff;border-radius:28px;box-shadow:0 10px 35px #8abcf02b,inset 0 0 0 4px #ffffff80;backdrop-filter:blur(12px);max-width:720px}.photo-frame{height:min(66vh,690px);min-height:340px;position:relative;overflow:hidden;border-radius:20px;background:#eaf5ff;border:4px solid #fff;box-shadow:0 0 0 1px #c6e2ff}.slide{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;opacity:0;transform:scale(1.025);transition:opacity 1.25s ease,transform 5s ease; background:#eaf5ff}.slide.active{opacity:1;transform:scale(1)}.count{position:absolute;bottom:12px;left:12px;padding:5px 12px;border-radius:20px;color:white;background:#6da7edb8;font-size:13px;z-index:2}.nav{position:absolute;top:50%;transform:translateY(-50%);width:42px;height:42px;border:1px solid white;border-radius:50%;background:#7eaff0df;color:white;font-size:25px;box-shadow:0 3px 12px #6c9ed84a;cursor:pointer;z-index:3}.prev{left:20px}.next{right:20px}.dots{display:flex;justify-content:center;gap:9px;padding:14px 0 3px}.dot{width:9px;height:9px;border:0;border-radius:99px;background:#c5e1ff;padding:0;cursor:pointer;transition:.25s}.dot.active{width:26px;background:#7eb4f5}.player{display:flex;align-items:center;gap:12px;max-width:720px;margin:17px auto 0;padding:12px 15px;border:1px solid #c4e1ff;background:#ffffffb5;border-radius:24px;box-shadow:0 5px 20px #8abcf01a}.music-btn{flex:0 0 42px;width:42px;height:42px;border:1px solid white;border-radius:50%;background:#8bbaf3;color:white;font-size:20px;cursor:pointer}.song-info{min-width:0;flex:1;text-align:left}.song-title{font-size:13px;font-weight:750;white-space:nowrap}.song-sub{font-size:11px;color:#94b7e2}.volume{width:72px;accent-color:#83b6f4}.footer{padding:24px 0 0;font-size:13px;letter-spacing:2px;color:#8db9ec}.hint{font-size:11px;color:#8caed6;margin-top:8px}@media(max-width:520px){.wrap{padding:12px 12px 26px}.logo{width:min(360px,100%)}.message{margin:3px auto 16px}.gallery{padding:7px;border-radius:21px}.photo-frame{height:62vh;min-height:300px;border-radius:15px}.nav{width:35px;height:35px;font-size:21px}.prev{left:13px}.next{right:13px}.player{gap:9px;padding:10px}.volume{width:48px}.footer{padding-top:18px}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}}
</style></head>
<body><div class="clouds"></div><div class="sparkles"><span>✦</span><span>♡</span><span>✧</span><span>✦</span></div>
<main class="wrap">
<img class="logo" src="assets/love-may-logo.png" alt="Love may logo">
<div class="message">ขอโทษที่ต้องให้บอกนู้นนี้ตลอด<br>ในเมื่อมันเป็นสิ่งที่เราต้องทำ<br><span class="heartline">── ♡ ──</span></div>
<section class="gallery" aria-label="รูปความทรงจำ">
<div class="photo-frame" id="frame">
<img class="slide active" src="assets/photo1.jpeg" alt="ความทรงจำรูปที่ 1">
<img class="slide" src="assets/photo2.jpeg" alt="ความทรงจำรูปที่ 2">
<img class="slide" src="assets/photo3.jpeg" alt="ความทรงจำรูปที่ 3">
<img class="slide" src="assets/photo4.jpeg" alt="ความทรงจำรูปที่ 4">
<img class="slide" src="assets/photo5.jpeg" alt="ความทรงจำรูปที่ 5">
<img class="slide" src="assets/photo6.jpeg" alt="ความทรงจำรูปที่ 6">
<div class="count" id="count">1 / 6</div></div>
<button class="nav prev" id="prev" aria-label="รูปก่อนหน้า">‹</button><button class="nav next" id="next" aria-label="รูปถัดไป">›</button>
<div class="dots" id="dots" aria-label="เลือกภาพ"></div></section>
<section class="player"><button class="music-btn" id="musicBtn" aria-label="เล่นเพลง">♫</button><div class="song-info"><div class="song-title">A little song for you ♡</div><div class="song-sub" id="musicStatus">แตะเพื่อเปิดเพลงของเรา</div></div><input class="volume" id="volume" type="range" min="0" max="1" step="0.05" value="0.75" aria-label="ระดับเสียง"></section>
<audio id="song" src="assets/love-song.mp3" loop preload="auto"></audio>
<div class="footer">MADE WITH LOVE ♡</div><div class="hint">ทุกภาพคือความทรงจำที่อยากเก็บไว้เสมอ ☁️</div>
</main>
<script>
const slides=[...document.querySelectorAll('.slide')], dotsBox=document.getElementById('dots'), count=document.getElementById('count');let current=0;let timer;
slides.forEach((_,i)=>{const b=document.createElement('button');b.className='dot'+(i===0?' active':'');b.setAttribute('aria-label','ไปภาพที่ '+(i+1));b.addEventListener('click',()=>show(i));dotsBox.appendChild(b)});const dots=[...dotsBox.children];
function show(i){current=(i+slides.length)%slides.length;slides.forEach((s,j)=>s.classList.toggle('active',j===current));dots.forEach((d,j)=>d.classList.toggle('active',j===current));count.textContent=(current+1)+' / '+slides.length;resetTimer()}
function resetTimer(){clearInterval(timer);timer=setInterval(()=>show(current+1),5000)}
document.getElementById('prev').addEventListener('click',()=>show(current-1));document.getElementById('next').addEventListener('click',()=>show(current+1));resetTimer();
const song=document.getElementById('song'),musicBtn=document.getElementById('musicBtn'),status=document.getElementById('musicStatus');song.volume=.75;
async function toggleMusic(){if(song.paused){try{await song.play();musicBtn.textContent='Ⅱ';status.textContent='กำลังเล่นเพลงให้เธอฟัง ♡'}catch(e){status.textContent='แตะอีกครั้งเพื่ออนุญาตให้เล่นเพลง'}}else{song.pause();musicBtn.textContent='♫';status.textContent='พักเพลงไว้ก่อน ♡'}}
musicBtn.addEventListener('click',toggleMusic);document.getElementById('volume').addEventListener('input',e=>song.volume=Number(e.target.value));
// Try autoplay on page load. iOS Safari may block audible autoplay until a user gesture.
async function startMusic(){try{await song.play();musicBtn.textContent='Ⅱ';status.textContent='กำลังเล่นเพลงให้เธอฟัง ♡';return true}catch(e){status.textContent='แตะหน้าจอหนึ่งครั้งเพื่อเปิดเพลง ♡';return false}}
startMusic();
// On the first interaction anywhere, retry playback to make starting music effortless on iPhone.
let firstGestureHandled=false;
async function firstGesture(){if(firstGestureHandled)return;firstGestureHandled=true;if(song.paused)await startMusic();}
document.addEventListener('touchstart',firstGesture,{once:true,passive:true});
document.addEventListener('click',firstGesture,{once:true});
document.addEventListener('keydown',firstGesture,{once:true});
</script></body></html>
